<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Tablet Cardboard VR with Hand Tracking</title>
    <!-- A-Frame Library -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <!-- MediaPipe Hands & Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    
    <style>
      /* Keep hidden video element for MediaPipe feed */
      #input_video {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- Hidden video element that feeds the front camera to MediaPipe -->
    <video id="input_video" playsinline></video>

    <!-- VR Scene -->
    <a-scene vr-mode-ui="enabled: true">
      <!-- Sky Background -->
      <a-sky color="#1A1A2E"></a-sky>

      <!-- Ambient and directional light -->
      <a-light type="ambient" color="#BBB"></a-light>
      <a-light type="directional" color="#FFF" intensity="0.6" position="-0.5 1 1"></a-light>

      <!-- Target box sitting in 3D space -->
      <a-box position="0 1.5 -3" rotation="0 45 0" color="#4CC3D9" id="target-box"></a-box>

      <!-- Hand-controlled Sphere cursor -->
      <a-sphere id="hand-cursor" position="0 1.5 -2" radius="0.1" color="#FF4081"></a-sphere>
